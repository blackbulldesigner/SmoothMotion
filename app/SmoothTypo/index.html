<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmoothTypo</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/license.css">
</head>
<body>
<div id="app">

  <!-- Barra de herramientas -->
  <div id="toolbar">

    <!-- 1 · Crear texto -->
    <button class="tt-btn" data-op="create" title="Crear capa de texto en el centro de la composición">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" class="ln"/></svg>
    </button>

    <!-- 2 · Dividir texto por líneas -->
    <button class="tt-btn" data-op="split" title="Dividir texto · clic: por líneas · Shift: por palabras · Ctrl: por letras">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M9 4H7a2 2 0 00-2 2M9 20H7a2 2 0 01-2-2M15 4h2a2 2 0 012 2M15 20h2a2 2 0 002-2M12 5v14"/></svg>
    </button>

    <!-- 3 · Importar texto desde .txt -->
    <button class="tt-btn" data-op="import" title="Importar líneas desde un .txt a las capas de texto seleccionadas">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M12 16V4M8 8l4-4 4 4M5 20h14"/></svg>
    </button>

    <!-- 4 · Resaltar -->
    <button class="tt-btn" data-op="highlight" title="Crear un resaltado detrás del texto">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M14.5 4.5l5 5L9 20l-5 1 1-5z"/><path d="M11.5 7.5l5 5"/></svg>
    </button>

    <!-- 5 · Subrayar -->
    <button class="tt-btn" data-op="underline" title="Subrayar el texto seleccionado">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M7 4v6a5 5 0 0010 0V4M5 21h14"/></svg>
    </button>

    <!-- 6 · Tachar -->
    <button class="tt-btn" data-op="strike" title="Tachar el texto seleccionado">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M16 5a4 3 0 00-4-2c-3 0-5 1.5-5 4 0 1.7 1.2 2.7 3 3.3M4 12h16M8 14c1.5.7 3 1.4 3 3 0 2-2 3-4 3a5 4 0 01-4-2"/></svg>
    </button>

    <!-- 7 · Reemplazar (buscar y reemplazar) -->
    <button class="tt-btn" data-op="replace" title="Buscar y reemplazar texto en las capas seleccionadas">
      <svg viewBox="0 0 24 24" class="ico st"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 16V8h3a2.5 2.5 0 010 5H9m3 0l3 3" class="thin"/></svg>
    </button>

    <!-- 8 · Contador numérico -->
    <button class="tt-btn" data-op="counter" title="Convertir en contador numérico animado">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M5 8h14M5 16h14M9 4L7 20M17 4l-2 16"/></svg>
    </button>

    <!-- 9 · Máquina de escribir -->
    <button class="tt-btn" data-op="typewriter" title="Animación de máquina de escribir (revelado por caracteres)">
      <svg viewBox="0 0 24 24" class="ico st"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M12 2v2M9 2h6"/></svg>
    </button>

    <!-- 10 · Estilo (relleno + trazo) -->
    <button class="tt-btn accent" data-op="style" title="Aplicar estilo: relleno y trazo (según Ajustes)">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M9.5 14.5L18 6a2 2 0 013 3l-8.5 8.5"/><path d="M9.5 14.5c-2 0-3 1-3.5 3-.4 1.6-1 2-2.5 2 .8-1 .3-1.7 1-3 .6-1.2 2-2 5-2z"/></svg>
    </button>

    <!-- 11 · Limpiar -->
    <button class="tt-btn" data-op="clean" title="Quitar añadidos de Type Tools de las capas seleccionadas">
      <svg viewBox="0 0 24 24" class="ico st"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    </button>

    <!-- 12 · Ajustes -->
    <button class="tt-btn" data-op="settings" id="btnSettings" title="Ajustes">
      <svg viewBox="0 0 24 24" class="ico st" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.3v2.7M12 19v2.7M21.7 12H19M5 12H2.3M18.86 5.14l-1.9 1.9M7.04 16.96l-1.9 1.9M18.86 18.86l-1.9-1.9M7.04 7.04l-1.9-1.9"/></svg>
    </button>

  </div>

  <!-- Modal de Ajustes -->
  <div id="overlay" class="hidden">
    <div id="modal">
      <div class="modal-head">
        <span>Ajustes</span>
        <button id="closeSettings" class="x" title="Cerrar">&times;</button>
      </div>
      <div class="modal-body">

        <div class="set-row">
          <label>Color (relleno / resaltado)</label>
          <input type="color" id="setColor" value="#ffd400">
        </div>

        <div class="set-row">
          <label>Color de trazo</label>
          <input type="color" id="setStrokeColor" value="#000000">
        </div>

        <div class="set-row">
          <label>Grosor de trazo</label>
          <div class="num"><input type="number" id="setStrokeWidth" value="4" min="0" step="0.5"><span>px</span></div>
        </div>

        <div class="set-row">
          <label>Relleno del resaltado</label>
          <div class="num"><input type="number" id="setHiPad" value="6" min="0" step="1"><span>px</span></div>
        </div>

        <div class="set-row">
          <label>Grosor subrayado / tachado</label>
          <div class="num"><input type="number" id="setLineW" value="3" min="1" step="0.5"><span>px</span></div>
        </div>

        <div class="set-row">
          <label>Velocidad máquina de escribir</label>
          <div class="num"><input type="number" id="setTwSpeed" value="0.05" min="0.005" step="0.01"><span>s/car</span></div>
        </div>

        <div class="set-divider"></div>

        <div class="set-row">
          <label>Contador — desde / hasta</label>
          <div class="num2">
            <input type="number" id="setCntFrom" value="0" step="1">
            <input type="number" id="setCntTo" value="100" step="1">
          </div>
        </div>

        <div class="set-row">
          <label>Contador — duración</label>
          <div class="num"><input type="number" id="setCntDur" value="3" min="0.1" step="0.1"><span>s</span></div>
        </div>

        <div class="set-row">
          <label>Contador — decimales</label>
          <div class="num"><input type="number" id="setCntDec" value="0" min="0" max="4" step="1"><span>díg.</span></div>
        </div>

      </div>
      <div class="modal-foot">
        <button id="resetSettings" class="btn-ghost">Restablecer</button>
        <button id="saveSettings" class="btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Toast de feedback -->
  <div id="toast"></div>

</div>

<!-- ── Escudo de licencia (HWID + key del bot de Discord) ─────────────────── -->
<div id="lic-overlay" class="lic-overlay">
  <div class="lic-card">
    <div class="onb-logo">Smooth<span>Typo</span></div>
    <h3 class="lic-title">Activa tu licencia</h3>
    <div class="lic-hwid-block">
      <span class="lic-hwid-label">Tu ID de equipo</span>
      <div class="lic-hwid-row">
        <code id="lic-hwid" class="lic-hwid-code" title="">—</code>
        <button type="button" class="lic-copy-btn" id="lic-copy-hwid">Copiar</button>
      </div>
    </div>
    <p class="lic-text">1. Copia el ID → 2. Reclámala en Discord con tu paquete → 3. Pega la key aquí</p>
    <input type="text" id="lic-input" class="lic-input" placeholder="SM-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="13" />
    <button type="button" id="lic-activate">Activar licencia</button>
    <button type="button" class="lic-btn-discord" id="lic-discord">Abrir Discord</button>
    <p id="lic-error" class="lic-error hidden"></p>
    <p class="lic-footnote">La misma key de SmoothMotion vale aquí. Válida solo en este equipo.</p>
  </div>
</div>

<script src="js/CSInterface.js"></script>
<script src="../shared/license-config.js"></script>
<script src="../shared/license.js"></script>
<script src="../shared/demo-shim.js"></script>
<script src="../shared/license-boot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
