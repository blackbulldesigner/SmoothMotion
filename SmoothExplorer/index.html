<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmoothExplorer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/license.css">
</head>
<body>

<div class="exp-panel">
  <div class="exp-toolbar">
    <button type="button" class="exp-icon-btn" id="exp-up" title="Subir un nivel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <button type="button" class="exp-icon-btn" id="exp-home" title="Ir a tu carpeta de usuario">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button type="button" class="exp-icon-btn" id="exp-browse" title="Abrir el explorador de Windows y elegir una carpeta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
    </button>
    <div class="exp-path" id="exp-path"></div>
    <button type="button" class="exp-icon-btn" id="exp-pin" title="Anclar esta carpeta a favoritos">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
    <button type="button" class="exp-icon-btn" id="exp-refresh" title="Refrescar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button type="button" class="exp-icon-btn" id="exp-settings" title="Ajustes del panel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="exp-favs" id="exp-favs"></div>

  <div class="exp-searchrow">
    <input type="text" class="exp-search" id="exp-search" placeholder="Filtrar en esta carpeta…" autocomplete="off" spellcheck="false" />
  </div>
  <div class="exp-filters" id="exp-filters">
    <button type="button" class="exp-chip active" data-exp-filter="all">Todo</button>
    <button type="button" class="exp-chip" data-exp-filter="image">Imágenes</button>
    <button type="button" class="exp-chip" data-exp-filter="video">Video</button>
    <button type="button" class="exp-chip" data-exp-filter="audio">Audio</button>
    <button type="button" class="exp-chip" data-exp-filter="project">Proyectos</button>
  </div>

  <div class="exp-list" id="exp-list">
    <div class="exp-empty">Cargando…</div>
  </div>

  <div class="exp-player" id="exp-player">
    <button type="button" class="exp-player-btn" id="exp-player-toggle" title="Reproducir / Pausar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <div class="exp-player-info">
      <div class="exp-player-name" id="exp-player-name">—</div>
      <input type="range" class="exp-player-seek" id="exp-player-seek" min="0" max="1000" value="0" />
    </div>
    <span class="exp-player-time" id="exp-player-time">0:00 / 0:00</span>
  </div>

  <div class="exp-actions">
    <button type="button" class="tk-btn tk-btn-primary" id="exp-import" style="flex:1;" title="Importa el archivo seleccionado al proyecto de After Effects.">Importar al proyecto</button>
    <button type="button" class="tk-btn" id="exp-import-comp" style="flex:1;" title="Importa el archivo y lo añade como capa a la composición activa.">Importar + añadir a comp</button>
  </div>

  <audio id="exp-audio" preload="metadata"></audio>
</div>

<!-- Ajustes -->
<div class="exp-modal-overlay" id="exp-settings-overlay">
  <div class="exp-modal">
    <h3>Ajustes de SmoothExplorer</h3>
    <div class="exp-field">
      <div class="exp-field-row"><label>Volumen del panel</label><span class="val" id="exp-vol-val">80%</span></div>
      <input type="range" id="exp-vol" min="0" max="100" value="80" />
    </div>
    <div class="exp-field">
      <div class="exp-field-row"><label>Tamaño de la cuadrícula</label><span class="val" id="exp-grid-val">Mediano</span></div>
      <input type="range" id="exp-grid" min="64" max="160" step="4" value="92" />
    </div>
    <button type="button" class="tk-btn tk-btn-primary" id="exp-settings-close">Hecho</button>
  </div>
</div>

<!-- ── Escudo de licencia (misma key de SmoothMotion) ─────────────────────── -->
<div id="lic-overlay" class="lic-overlay">
  <div class="lic-card">
    <div class="onb-logo">Smooth<span>Explorer</span></div>
    <h3 class="lic-title">Activa tu licencia</h3>
    <div class="lic-hwid-block">
      <span class="lic-hwid-label">Tu ID de equipo</span>
      <div class="lic-hwid-row">
        <code id="lic-hwid" class="lic-hwid-code" title="">—</code>
        <button type="button" class="lic-copy-btn" id="lic-copy-hwid">Copiar</button>
      </div>
    </div>
    <p class="lic-text">1. Copia el ID → 2. Reclámala en Discord con tu paquete → 3. Pega la key aquí</p>
    <input type="text" id="lic-input" class="lic-input" placeholder="SM-XXXX-XXXX-X" autocomplete="off" spellcheck="false" maxlength="14" />
    <button type="button" id="lic-activate">Activar licencia</button>
    <button type="button" class="lic-btn-discord" id="lic-discord">Abrir Discord</button>
    <p id="lic-error" class="lic-error hidden"></p>
    <p class="lic-footnote">La misma key de SmoothMotion vale aquí. Válida solo en este equipo.</p>
  </div>
</div>

<div id="exp-toast"></div>

<script src="js/CSInterface.js"></script>
<script src="../shared/license-config.js"></script>
<script src="../shared/license.js"></script>
<script>window.SM_REQUIRED_MODULE = 'explorer';</script>
<script src="../shared/demo-shim.js"></script>
<script src="../shared/license-boot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
