<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmoothPaste</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="../shared/license.css">
</head>
<body>

<div class="sp-panel">
  <div class="sp-header">
    <div class="sp-brand">Smooth<span>Paste</span></div>
  </div>

  <div class="sp-actions">
    <button type="button" class="sp-big sp-primary" id="sp-copy">
      <span class="sp-ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </span>
      <span class="sp-title">Copiar frame</span>
      <span class="sp-sub">Captura el fotograma actual de la comp y lo copia al portapapeles del sistema.</span>
    </button>

    <button type="button" class="sp-big" id="sp-paste">
      <span class="sp-ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
      </span>
      <span class="sp-title">Pegar imagen</span>
      <span class="sp-sub">Pega la imagen del portapapeles como una capa nueva en la composición activa.</span>
    </button>
  </div>

  <p class="sp-hint">Todo es reversible con Ctrl+Z. La imagen pegada se guarda en el proyecto.</p>

  <div class="sp-status" id="sp-status">Listo.</div>
</div>

<!-- ── Escudo de licencia (misma key de SmoothMotion) ─────────────────────── -->
<div id="lic-overlay" class="lic-overlay">
  <div class="lic-card">
    <div class="onb-logo">Smooth<span>Paste</span></div>
    <h3 class="lic-title">Activa tu licencia</h3>
    <div class="lic-hwid-block">
      <span class="lic-hwid-label">Tu ID de equipo</span>
      <div class="lic-hwid-row">
        <code id="lic-hwid" class="lic-hwid-code" title="">—</code>
        <button type="button" class="lic-copy-btn" id="lic-copy-hwid">Copiar</button>
      </div>
    </div>
    <p class="lic-text">1. Copia el ID → 2. Reclámala en Discord con tu paquete → 3. Pega la key aquí</p>
    <input type="text" id="lic-input" class="lic-input" placeholder="SM-XXXX-XXXX-X" autocomplete="off" spellcheck="false" maxlength="14" />
    <button type="button" id="lic-activate">Activar licencia</button>
    <button type="button" class="lic-btn-discord" id="lic-discord">Abrir Discord</button>
    <p id="lic-error" class="lic-error hidden"></p>
    <p class="lic-footnote">La misma key de SmoothMotion vale aquí. Válida solo en este equipo.</p>
  </div>
</div>

<script src="js/CSInterface.js"></script>
<script src="../shared/license-config.js"></script>
<script src="../shared/license.js"></script>
<script>window.SM_REQUIRED_MODULE = 'paste';</script>
<script src="../shared/demo-shim.js"></script>
<script src="../shared/license-boot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
